<!DOCTYPE html>
<html>
<head>
    <title>Div Layout</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        .container{
            width:700px;
            height:500px;
            margin:30px auto;
            display:grid;

            grid-template-columns:100px 100px 100px 100px 100px 100px;
            grid-template-rows:80px 80px 80px 80px 80px 80px;
            gap:2px;
        }

        .box{
            border:1px solid black;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .b1{
            grid-row:1 / 7;
            grid-column:1;
        }

        .b2{
            grid-row:1 / 3;
            grid-column:2 / 4;
        }

        .b3{
            grid-row:1;
            grid-column:4 / 7;
        }

        .b4{
            grid-row:2 / 4;
            grid-column:4 / 7;
        }

        .b5{
            grid-row:3;
            grid-column:2 / 4;
        }

        .b6{
            grid-row:4;
            grid-column:2;
        }

        .b7{
            grid-row:4;
            grid-column:3 / 5;
        }

        .b8{
            grid-row:4;
            grid-column:5 / 7;
        }

        .b9{
            grid-row:5 / 7;
            grid-column:2 / 4;
        }

        .b10{
            grid-row:5;
            grid-column:4 / 6;
        }

        .b11{
            grid-row:5;
            grid-column:6;
        }

        .b12{
            grid-row:6;
            grid-column:4 / 7;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="box b1">Text</div>
    <div class="box b2">Text</div>
    <div class="box b3">Text</div>
    <div class="box b4">Text</div>
    <div class="box b5">Text</div>
    <div class="box b6">Text</div>
    <div class="box b7">Text</div>
    <div class="box b8">Text</div>
    <div class="box b9">Text</div>
    <div class="box b10">Text</div>
    <div class="box b11">Text</div>
    <div class="box b12">Text</div>

</div>

</body>
</html>
